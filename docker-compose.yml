version: "3.8"

services:
  memcached:
    image: memcached
    restart: always
    expose:
      - "11211"

  yopass:
    build: .
    restart: always
    ports:
      - "80"
    environment:
      - MEMCACHED=$SERVICE_NAME_MEMCACHED:11211
      - PORT=80
      - PRIVACY_NOTICE_URL=https://doverunner.com/privacy-policy/
      - DISABLE_FEATURES=true
    healthcheck:
      test: ["CMD", "/yopass-server", "--health-check"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
